<svg viewBox="0 0 460 280" xmlns="http://www.w3.org/2000/svg">

  <rect width="460" height="280" fill="white"/>

  <!-- Cola: gira desde donde se une al cuerpo (x≈90, y=140) -->
  <g data-zone="cola"               data-label="Cola"
     data-pivot-x="95"              data-pivot-y="140"
     data-anim="swing"              data-anim-amplitude="22"
     data-anim-speed="1.4"          data-anim-offset="0">
    <polygon points="95,100 20,60 20,220 95,180"
             fill="white" stroke="none"/>
  </g>

  <!-- Cuerpo principal -->
  <g data-zone="cuerpo"             data-label="Cuerpo"
     data-pivot-x="250"             data-pivot-y="140"
     data-anim="breathe"            data-anim-amplitude="0.025"
     data-anim-speed="0.75"         data-anim-offset="0">
    <ellipse cx="252" cy="140" rx="160" ry="90" fill="white" stroke="none"/>
  </g>

  <!-- Aleta dorsal: arriba del cuerpo -->
  <g data-zone="aleta_dorsal"       data-label="Aleta dorsal"
     data-pivot-x="252"             data-pivot-y="52"
     data-anim="float"              data-anim-amplitude="5"
     data-anim-speed="1.0"          data-anim-offset="0.3">
    <polygon points="180,52 252,52 220,10" fill="white" stroke="none"/>
  </g>

  <!-- Aleta pectoral -->
  <g data-zone="aleta_pectoral"     data-label="Aleta pectoral"
     data-pivot-x="290"             data-pivot-y="158"
     data-anim="swing"              data-anim-amplitude="12"
     data-anim-speed="1.4"          data-anim-offset="0.4">
    <ellipse cx="290" cy="185" rx="45" ry="22"
             transform="rotate(30, 290, 158)"
             fill="white" stroke="none"/>
  </g>

  <!-- Vientre (barriga del pez, color distinto) -->
  <g data-zone="vientre"            data-label="Vientre"
     data-pivot-x="252"             data-pivot-y="185"
     data-anim="breathe"            data-anim-amplitude="0.025"
     data-anim-speed="0.75"         data-anim-offset="0">
    <ellipse cx="252" cy="186" rx="120" ry="42" fill="white" stroke="none"/>
  </g>

  <!-- Escamas: patrón decorativo -->
  <g data-zone="escamas"            data-label="Escamas"
     data-anim="shimmer"            data-anim-amplitude="0.25"
     data-anim-speed="1.8"          data-anim-offset="0">
    <circle cx="220" cy="125" r="20" fill="white" stroke="none"/>
    <circle cx="265" cy="118" r="18" fill="white" stroke="none"/>
    <circle cx="310" cy="128" r="18" fill="white" stroke="none"/>
    <circle cx="238" cy="155" r="17" fill="white" stroke="none"/>
    <circle cx="285" cy="148" r="16" fill="white" stroke="none"/>
  </g>

  <!-- ══ CONTORNOS ══ -->
  <g id="contornos" fill="none" stroke="#1a1a1a" stroke-width="2.5"
     stroke-linejoin="round" stroke-linecap="round">
    <polygon points="95,100 20,60 20,220 95,180"/>
    <ellipse cx="252" cy="140" rx="160" ry="90"/>
    <polygon points="180,52 252,52 220,10"/>
    <ellipse cx="290" cy="185" rx="45" ry="22" transform="rotate(30, 290, 158)"/>
    <ellipse cx="252" cy="186" rx="120" ry="42"/>
    <!-- Escamas -->
    <circle cx="220" cy="125" r="20"/>
    <circle cx="265" cy="118" r="18"/>
    <circle cx="310" cy="128" r="18"/>
    <circle cx="238" cy="155" r="17"/>
    <circle cx="285" cy="148" r="16"/>
    <!-- Ojo -->
    <circle cx="368" cy="128" r="16"/>
    <circle cx="372" cy="124" r="6" fill="#1a1a1a" stroke="none"/>
    <circle cx="375" cy="121" r="2.5" fill="white" stroke="none"/>
    <!-- Boca -->
    <path d="M 412 148 Q 424 155 412 162" stroke-width="2.5"/>
  </g>

  <text x="230" y="270" text-anchor="middle" font-size="11" fill="#bbb">
    ¡Colorea el pez!
  </text>
</svg>