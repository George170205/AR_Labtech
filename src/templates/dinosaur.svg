<svg viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg">

  <rect width="500" height="380" fill="white"/>

  <!-- ══ ZONAS ══ -->

  <!-- Cola: gira desde donde se une al cuerpo (x≈70, y=230) -->
  <g data-zone="cola"           data-label="Cola"
     data-pivot-x="70"          data-pivot-y="230"
     data-anim="swing"          data-anim-amplitude="20"
     data-anim-speed="0.9"      data-anim-offset="0">
    <polygon points="60,230 10,170 10,290 60,250"
             fill="white" stroke="none"/>
  </g>

  <!-- Cuerpo: respira (escala desde su centro) -->
  <g data-zone="cuerpo"         data-label="Cuerpo"
     data-pivot-x="230"         data-pivot-y="230"
     data-anim="breathe"        data-anim-amplitude="0.03"
     data-anim-speed="0.7"      data-anim-offset="0">
    <ellipse cx="230" cy="230" rx="160" ry="100"
             fill="white" stroke="none"/>
  </g>

  <!-- Cabeza: mira arriba/abajo desde la unión con el cuerpo -->
  <g data-zone="cabeza"         data-label="Cabeza"
     data-pivot-x="305"         data-pivot-y="185"
     data-anim="swing"          data-anim-amplitude="7"
     data-anim-speed="0.55"     data-anim-offset="1.4">
    <ellipse cx="370" cy="155" rx="80" ry="65"
             fill="white" stroke="none"/>
    <polygon points="370,205 430,215 440,235 370,230"
             fill="white" stroke="none"/>
  </g>

  <!-- Dorsal: flota ligeramente arriba/abajo -->
  <g data-zone="dorsal"         data-label="Dorsal"
     data-pivot-x="215"         data-pivot-y="135"
     data-anim="float"          data-anim-amplitude="5"
     data-anim-speed="0.85"     data-anim-offset="0.5">
    <polygon points="130,135 155,95 180,130 205,80 230,125 255,75 280,120 300,135"
             fill="white" stroke="none"/>
  </g>

  <!-- Pata trasera: caminar (fase 0) -->
  <g data-zone="pata_trasera"   data-label="Pata trasera"
     data-pivot-x="177"         data-pivot-y="310"
     data-anim="walk"           data-anim-amplitude="18"
     data-anim-speed="1.6"      data-anim-offset="0">
    <rect x="150" y="310" width="55" height="65" rx="12"
          fill="white" stroke="none"/>
  </g>

  <!-- Pata delantera: caminar (fase π = opuesta a la trasera) -->
  <g data-zone="pata_delantera" data-label="Pata delantera"
     data-pivot-x="327"         data-pivot-y="310"
     data-anim="walk"           data-anim-amplitude="18"
     data-anim-speed="1.6"      data-anim-offset="3.14159">
    <rect x="300" y="310" width="55" height="65" rx="12"
          fill="white" stroke="none"/>
  </g>

  <!-- Manchas: shimmer de brillo -->
  <g data-zone="manchas"        data-label="Manchas"
     data-anim="shimmer"        data-anim-amplitude="0.25"
     data-anim-speed="2.2"      data-anim-offset="0">
    <circle cx="210" cy="205" r="28" fill="white" stroke="none"/>
    <circle cx="275" cy="235" r="22" fill="white" stroke="none"/>
    <circle cx="230" cy="265" r="25" fill="white" stroke="none"/>
    <circle cx="170" cy="245" r="20" fill="white" stroke="none"/>
  </g>

  <!-- ══ CONTORNOS (id="contornos" es el selector que usa sceneBuilder) ══ -->
  <g id="contornos" fill="none" stroke="#1a1a1a" stroke-width="3"
     stroke-linejoin="round" stroke-linecap="round">
    <polygon points="60,230 10,170 10,290 60,250"/>
    <ellipse cx="230" cy="230" rx="160" ry="100"/>
    <ellipse cx="370" cy="155" rx="80" ry="65"/>
    <polygon points="370,205 430,215 440,235 370,230"/>
    <polyline points="130,135 155,95 180,130 205,80 230,125 255,75 280,120 300,135"/>
    <rect x="150" y="310" width="55" height="65" rx="12"/>
    <rect x="300" y="310" width="55" height="65" rx="12"/>
    <circle cx="210" cy="205" r="28"/>
    <circle cx="275" cy="235" r="22"/>
    <circle cx="230" cy="265" r="25"/>
    <circle cx="170" cy="245" r="20"/>
    <circle cx="395" cy="140" r="12"/>
    <circle cx="399" cy="136" r="4" fill="#1a1a1a" stroke="none"/>
    <circle cx="402" cy="133" r="2" fill="white" stroke="none"/>
    <ellipse cx="448" cy="228" rx="5" ry="3" fill="#1a1a1a" stroke="none"/>
  </g>

  <text x="250" y="373" text-anchor="middle"
        font-size="11" fill="#bbb">¡Colorea el dinosaurio!</text>
</svg>