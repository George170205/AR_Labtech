<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">

  <rect width="400" height="300" fill="white"/>

  <!-- ══ ZONAS ══ -->

  <!-- Ala superior izquierda: gira desde la unión con el cuerpo.
       Amplitude negativa = punta sube (contra-horario) cuando sin>0 -->
  <g data-zone="ala_sup_izq"        data-label="Ala superior izquierda"
     data-pivot-x="200"             data-pivot-y="165"
     data-anim="swing"              data-anim-amplitude="-24"
     data-anim-speed="1.1"          data-anim-offset="0">
    <ellipse cx="120" cy="130" rx="100" ry="62"
             transform="rotate(-18, 200, 165)"
             fill="white" stroke="none"/>
  </g>

  <!-- Ala superior derecha: amplitude positiva = punta sube (horario) -->
  <g data-zone="ala_sup_der"        data-label="Ala superior derecha"
     data-pivot-x="200"             data-pivot-y="165"
     data-anim="swing"              data-anim-amplitude="24"
     data-anim-speed="1.1"          data-anim-offset="0">
    <ellipse cx="280" cy="130" rx="100" ry="62"
             transform="rotate(18, 200, 165)"
             fill="white" stroke="none"/>
  </g>

  <!-- Ala inferior izquierda -->
  <g data-zone="ala_inf_izq"        data-label="Ala inferior izquierda"
     data-pivot-x="200"             data-pivot-y="185"
     data-anim="swing"              data-anim-amplitude="-16"
     data-anim-speed="1.1"          data-anim-offset="0.15">
    <ellipse cx="145" cy="225" rx="68" ry="46"
             transform="rotate(-10, 200, 185)"
             fill="white" stroke="none"/>
  </g>

  <!-- Ala inferior derecha -->
  <g data-zone="ala_inf_der"        data-label="Ala inferior derecha"
     data-pivot-x="200"             data-pivot-y="185"
     data-anim="swing"              data-anim-amplitude="16"
     data-anim-speed="1.1"          data-anim-offset="0.15">
    <ellipse cx="255" cy="225" rx="68" ry="46"
             transform="rotate(10, 200, 185)"
             fill="white" stroke="none"/>
  </g>

  <!-- Cuerpo -->
  <g data-zone="cuerpo"             data-label="Cuerpo"
     data-pivot-x="200"             data-pivot-y="200"
     data-anim="breathe"            data-anim-amplitude="0.04"
     data-anim-speed="0.8"          data-anim-offset="0">
    <ellipse cx="200" cy="195" rx="12" ry="52" fill="white" stroke="none"/>
    <circle  cx="200" cy="132" r="17"          fill="white" stroke="none"/>
  </g>

  <!-- Manchas — detalles decorativos de las alas -->
  <g data-zone="manchas"            data-label="Manchas"
     data-anim="shimmer"            data-anim-amplitude="0.3"
     data-anim-speed="2.0"          data-anim-offset="0">
    <circle cx="110" cy="118" r="16" fill="white" stroke="none"/>
    <circle cx="162" cy="148" r="11" fill="white" stroke="none"/>
    <circle cx="290" cy="118" r="16" fill="white" stroke="none"/>
    <circle cx="238" cy="148" r="11" fill="white" stroke="none"/>
    <circle cx="145" cy="225" r="11" fill="white" stroke="none"/>
    <circle cx="255" cy="225" r="11" fill="white" stroke="none"/>
  </g>

  <!-- ══ CONTORNOS ══ -->
  <g id="contornos" fill="none" stroke="#1a1a1a" stroke-width="2.5"
     stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="120" cy="130" rx="100" ry="62" transform="rotate(-18, 200, 165)"/>
    <ellipse cx="280" cy="130" rx="100" ry="62" transform="rotate(18, 200, 165)"/>
    <ellipse cx="145" cy="225" rx="68"  ry="46" transform="rotate(-10, 200, 185)"/>
    <ellipse cx="255" cy="225" rx="68"  ry="46" transform="rotate(10, 200, 185)"/>
    <ellipse cx="200" cy="195" rx="12"  ry="52"/>
    <circle  cx="200" cy="132" r="17"/>
    <!-- Manchas -->
    <circle cx="110" cy="118" r="16"/>
    <circle cx="162" cy="148" r="11"/>
    <circle cx="290" cy="118" r="16"/>
    <circle cx="238" cy="148" r="11"/>
    <circle cx="145" cy="225" r="11"/>
    <circle cx="255" cy="225" r="11"/>
    <!-- Antenas -->
    <line x1="194" y1="116" x2="165" y2="75" stroke-width="2"/>
    <circle cx="163" cy="72" r="4" fill="#1a1a1a" stroke="none"/>
    <line x1="206" y1="116" x2="235" y2="75" stroke-width="2"/>
    <circle cx="237" cy="72" r="4" fill="#1a1a1a" stroke="none"/>
  </g>

  <text x="200" y="292" text-anchor="middle" font-size="11" fill="#bbb">
    ¡Colorea la mariposa!
  </text>
</svg>